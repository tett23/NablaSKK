name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  # ==================================================================
  # Tests (includes the 400-case acceptance suite)
  # ==================================================================
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Swift FFI smoke test
        if: runner.os == 'macOS'
        run: sh swift/run-smoke-test.sh

  # ==================================================================
  # Build artifacts
  # ==================================================================
  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release -p skkserv -p skk-cli
      - name: Package
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/nablaskk-tools-linux-x86_64.tar.gz \
              skkserv skk-cli
      - uses: actions/upload-artifact@v4
        with:
          name: nablaskk-tools-linux-x86_64
          path: dist/nablaskk-tools-linux-x86_64.tar.gz

  build-macos:
    needs: test
    runs-on: macos-latest
    # Optional Developer ID signing + notarization: set these repository
    # secrets and the app is signed and notarized; otherwise it is ad-hoc
    # signed (users must clear quarantine, see README).
    #   MACOS_CERT_P12       - base64 of the Developer ID Application .p12
    #   MACOS_CERT_PASSWORD  - password of the .p12
    #   MACOS_SIGN_IDENTITY  - e.g. "Developer ID Application: Name (TEAMID)"
    #   NOTARY_APPLE_ID / NOTARY_TEAM_ID / NOTARY_PASSWORD
    #                        - Apple ID, team id, app-specific password
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          echo "$MACOS_CERT_P12" | base64 -d > cert.p12
          security create-keychain -p ci-keychain build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-keychain build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import cert.p12 -k build.keychain \
              -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
              -s -k ci-keychain build.keychain
          rm cert.p12

      - name: Build NablaSKK.app (universal)
        run: UNIVERSAL=1 SIGN_IDENTITY="${MACOS_SIGN_IDENTITY:--}" sh macos/build-app.sh

      - name: Notarize and staple
        if: env.MACOS_CERT_P12 != '' && env.NOTARY_APPLE_ID != ''
        run: |
          ditto -c -k --keepParent macos/dist/NablaSKK.app notarize.zip
          xcrun notarytool submit notarize.zip \
              --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" \
              --password "$NOTARY_PASSWORD" \
              --wait
          xcrun stapler staple macos/dist/NablaSKK.app

      - name: Build CLI tools (universal)
        run: |
          cargo build --release -p skkserv -p skk-cli --target aarch64-apple-darwin
          cargo build --release -p skkserv -p skk-cli --target x86_64-apple-darwin
          mkdir -p target/universal
          for bin in skkserv skk-cli; do
            lipo -create \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin" \
              -output "target/universal/$bin"
          done

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent macos/dist/NablaSKK.app dist/NablaSKK-macos-universal.app.zip
          tar -C target/universal -czf dist/nablaskk-tools-macos-universal.tar.gz \
              skkserv skk-cli
          mkdir -p ffi
          lipo -create \
            target/aarch64-apple-darwin/release/libnablaskk_ffi.a \
            target/x86_64-apple-darwin/release/libnablaskk_ffi.a \
            -output ffi/libnablaskk_ffi.a
          cp crates/nablaskk-ffi/include/nablaskk.h swift/SKKSession.swift ffi/
          tar -czf dist/nablaskk-ffi-macos-universal.tar.gz -C ffi \
              libnablaskk_ffi.a nablaskk.h SKKSession.swift

      - uses: actions/upload-artifact@v4
        with:
          name: nablaskk-macos-universal
          path: dist/*

  # ==================================================================
  # Release (tags v*)
  # ==================================================================
  release:
    needs: [build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
